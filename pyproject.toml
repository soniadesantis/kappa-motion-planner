[project]
name = "kappa_planner"
version = "0.1.0"
description = "Kappa Motion Planner for Corridor Navigation"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.7"
license = { text = "GNU LGPLv3" }

authors = [
    { name = "Sonia De Santis" },
    { name = "Alejandro Astudillo" }
]

maintainers = [
    { email = "sonia.desantis@kuleuven.be" }
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.8",
    "matplotlib",
    "PyYAML>=6.0",
    "sympy>=1.12",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]