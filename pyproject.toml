[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa_planner"
version = "0.1.0"
description = "Kappa Motion Planner for Corridor Navigation"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = "LGPL-3.0-only"

authors = [
    { name = "Sonia De Santis" },
    { name = "Alejandro Astudillo" }
]

maintainers = [
    { email = "sonia.desantis@kuleuven.be" }
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.8",
    "matplotlib",
    "PyYAML>=6.0",
    "sympy>=1.12",
]

[project.urls]
Repository = "https://github.com/soniadesantis/kappa-motion-planner"
Issues = "https://github.com/soniadesantis/kappa-motion-planner/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
kappa_planner = ["vehicle_library/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
